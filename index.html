<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0c29">
<title>Fault Guard Pro</title>

<!-- Modern Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root {
    /* Liquid Glass Palette */
    --glass-surface: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    
    /* Neon Accents */
    --neon-blue: #00f2fe;
    --neon-purple: #bd00ff;
    --neon-green: #0aff60;
    --neon-red: #ff0f4f;
    --neon-amber: #ffaa00;

    /* Physics */
    --jelly-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55); 
    --smooth-ease: cubic-bezier(0.4, 0, 0.2, 1);
    
    --card-radius: 32px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  
  body {
    margin: 0;
    background: #050505;
    color: #ffffff;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- LIQUID BACKGROUND ANIMATION --- */
  .liquid-bg {
    position: fixed; inset: 0; z-index: -2;
    background: #0f0c29;
    overflow: hidden;
  }
  
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    animation: floatOrb 20s infinite ease-in-out alternate;
    will-change: transform;
  }
  
  .orb-1 { width: 400px; height: 400px; background: var(--neon-purple); top: -100px; left: -100px; animation-duration: 25s; }
  .orb-2 { width: 300px; height: 300px; background: var(--neon-blue); bottom: 10%; right: -50px; animation-duration: 18s; animation-delay: -5s; }
  .orb-3 { width: 250px; height: 250px; background: var(--neon-red); bottom: -50px; left: 30%; animation-duration: 22s; animation-delay: -10s; }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  .noise-overlay {
    position: fixed; inset: 0; z-index: -1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* --- APP LAYOUT --- */
  .app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    padding-bottom: 120px; 
    overflow-y: auto;
    scrollbar-width: none; 
  }
  .app-container::-webkit-scrollbar { display: none; } 

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
    padding: 0 10px;
  }
  .logo-text { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .status-pill {
    background: rgba(10, 255, 96, 0.1); border: 1px solid rgba(10, 255, 96, 0.2);
    color: var(--neon-green); padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    box-shadow: 0 0 15px rgba(10, 255, 96, 0.1);
  }

  /* --- LIQUID GLASS CARDS --- */
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }

  .glass-card {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--card-radius);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 0 0 1px rgba(255,255,255,0.05);
    padding: 20px;
    overflow: hidden;
    transition: transform 0.4s var(--jelly-bounce), box-shadow 0.3s ease;
    will-change: transform;
  }

  .glass-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
    border-radius: var(--card-radius) var(--card-radius) 50% 50% / var(--card-radius) var(--card-radius) 20px 20px;
    pointer-events: none;
  }

  .glass-card:active {
    transform: scale(0.92);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  /* Card Inner Content */
  .card-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    display: grid; place-items: center; font-size: 20px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 12px;
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.05);
  }
  .card-label { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
  .card-val { font-size: 32px; font-weight: 300; margin-top: 4px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
  .card-unit { font-size: 16px; color: rgba(255,255,255,0.4); margin-left: 2px; }

  /* Fault State */
  .glass-card.fault {
    background: rgba(255, 15, 79, 0.15);
    border-color: rgba(255, 15, 79, 0.4);
    box-shadow: 0 0 30px rgba(255, 15, 79, 0.2), inset 0 0 20px rgba(255, 15, 79, 0.1);
    animation: pulseFault 2s infinite;
  }
  @keyframes pulseFault { 0% { box-shadow: 0 0 0 0 rgba(255, 15, 79, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 15, 79, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 15, 79, 0); } }

  /* --- RELAY SWITCH --- */
  .relay-card {
    margin-top: 16px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px;
  }
  .switch-container {
    width: 68px; height: 40px;
    background: rgba(0,0,0,0.4);
    border-radius: 40px;
    padding: 4px;
    position: relative;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    transition: background 0.3s ease;
  }
  .switch-knob {
    width: 32px; height: 32px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: transform 0.5s var(--jelly-bounce);
  }
  
  .switch-container.tripped { background: rgba(255, 15, 79, 0.3); }
  .switch-container.tripped .switch-knob { transform: translateX(28px); background: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }

  /* --- FLOATING NAV BAR --- */
  .nav-bar {
    position: fixed; bottom: 20px; left: 20px; right: 20px;
    height: 75px;
    background: rgba(20, 20, 25, 0.75);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-evenly; align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 100;
  }

  .nav-btn {
    background: none; border: none; color: rgba(255,255,255,0.5);
    font-size: 24px; padding: 12px; border-radius: 16px;
    transition: all 0.3s var(--jelly-bounce);
    position: relative;
  }
  .nav-btn:active { transform: scale(0.8); color: #fff; background: rgba(255,255,255,0.1); }
  
  .fab {
    width: 60px; height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    border: none; color: #fff; font-size: 24px;
    box-shadow: 0 8px 20px rgba(189, 0, 255, 0.3);
    transform: translateY(-25px); 
    transition: transform 0.4s var(--jelly-bounce);
    display: grid; place-items: center;
  }
  .fab:active { transform: translateY(-25px) scale(0.85); }

  /* --- MODAL ANIMATIONS --- */
  .chart-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  .chart-overlay.open { 
    opacity: 1; 
    visibility: visible;
    transition: opacity 0.3s ease, visibility 0s;
  }
  
  .chart-modal {
    width: 90%; 
    background: linear-gradient(160deg, rgba(30, 30, 40, 0.95), rgba(15, 15, 20, 0.98));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px; padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    transform: scale(0.5) translateY(100px);
    opacity: 0;
    transition: transform 0.6s var(--jelly-bounce), opacity 0.4s ease;
  }
  
  .chart-overlay.open .chart-modal { 
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  /* --- AI MODAL --- */
  .ai-dialog {
    width: 90%; max-height: 70vh;
    background: linear-gradient(160deg, #1f1f2e, #141419);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px; padding: 24px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .ai-content { overflow-y: auto; color: #ddd; line-height: 1.6; margin: 15px 0; font-size: 15px; }
  .ai-content strong { color: var(--neon-blue); }
  
  .loader {
    width: 50px; height: 50px; border-radius: 50%;
    background: conic-gradient(#0000 10%, var(--neon-blue));
    -webkit-mask: radial-gradient(farthest-side,#0000 calc(100% - 8px),#000 0);
    animation: spinner 1s infinite linear; margin: 20px auto;
  }
  @keyframes spinner {to{transform: rotate(1turn)}}

  /* Inputs */
  .glass-input {
    width: 100%; padding: 16px; border-radius: 16px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-family: inherit; margin: 10px 0;
  }
  .glass-btn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: rgba(255,255,255,0.1); color: #fff; font-weight: 600;
    margin-top: 10px; transition: 0.3s;
  }
  .glass-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.98); }

  #cameraInput { display: none; }
</style>
</head>
<body>

<!-- ANIMATED BACKGROUND -->
<div class="liquid-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="noise-overlay"></div>

<!-- HIDDEN CAMERA INPUT -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)">

<div class="app-container">
  
  <!-- HEADER -->
  <div class="header">
    <div class="logo-text">FaultGuard</div>
    <div id="sys" class="status-pill">
      <i class="fas fa-check-circle"></i> Secure
    </div>
  </div>

  <!-- MAIN SENSOR GRID -->
  <div class="grid">
    <div id="cVol" class="glass-card" onclick="openChart('vol')">
      <div class="card-icon" style="color:var(--neon-blue)"><i class="fas fa-bolt"></i></div>
      <div class="card-label">Voltage</div>
      <div class="card-val"><span id="vVol">0.0</span><span class="card-unit">V</span></div>
    </div>

    <div id="cCur" class="glass-card" onclick="openChart('cur')">
      <div class="card-icon" style="color:var(--neon-green)"><i class="fas fa-wave-square"></i></div>
      <div class="card-label">Current</div>
      <div class="card-val"><span id="vCur">0.00</span><span class="card-unit">A</span></div>
    </div>

    <div id="cTmp" class="glass-card" onclick="openChart('tmp')">
      <div class="card-icon" style="color:var(--neon-amber)"><i class="fas fa-temperature-high"></i></div>
      <div class="card-label">Core Temp</div>
      <div class="card-val"><span id="vTmp">0.0</span><span class="card-unit">°C</span></div>
    </div>

    <div id="cLek" class="glass-card" onclick="openChart('lek')">
      <div class="card-icon" style="color:var(--neon-red)"><i class="fas fa-droplet"></i></div>
      <div class="card-label">Leakage</div>
      <div class="card-val"><span id="vLek">0.00</span><span class="card-unit">A</span></div>
    </div>
  </div>

  <!-- RELAY CONTROL -->
  <div class="glass-card relay-card">
    <div>
      <div class="card-label" style="margin-bottom:4px;">Master Relay</div>
      <div id="txtRelay" style="font-size:18px; font-weight:600;">Armed</div>
    </div>
    <div id="btnRelay" class="switch-container">
      <div class="switch-knob"></div>
    </div>
  </div>

</div>

<!-- FLOATING NAVIGATION -->
<div class="nav-bar">
  <button class="nav-btn" onclick="diagnoseSystem()"><i class="fas fa-wand-magic-sparkles"></i></button>
  <button class="nav-btn" onclick="generateReport()"><i class="fas fa-file-invoice"></i></button>
  
  <!-- FAB -->
  <button class="fab" onclick="document.getElementById('cameraInput').click()">
    <i class="fas fa-camera"></i>
  </button>
  
  <button class="nav-btn" onclick="openSettings()"><i class="fas fa-cog"></i></button>
  <button class="nav-btn" onclick="location.reload()"><i class="fas fa-rotate-right"></i></button>
</div>

<!-- MODALS -->

<!-- CHART OVERLAY -->
<div id="chartOverlay" class="chart-overlay" onclick="closeModals(event)">
  <div class="chart-modal" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
      <span style="font-size:20px; font-weight:600; color:#fff;" id="chartTitle">Trend</span>
      <i class="fas fa-times" onclick="closeModals()" style="font-size:24px; opacity:0.5; color:#fff;"></i>
    </div>
    <div style="height:250px;"><canvas id="chartMain"></canvas></div>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div id="settingsOverlay" class="chart-overlay" onclick="closeModals(event)">
  <div class="chart-modal ai-dialog" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">First Run Setup</h2>
    <p style="opacity:0.8; font-size:14px; margin-bottom:15px;">
      <b>Secure Mode:</b> To use AI features, please paste your Gemini API Key below. <br><br>
      This key is saved <b>locally in your browser</b> and is never sent to our servers.
    </p>
    <input type="password" id="apiKeyInput" class="glass-input" placeholder="Paste key starting with AIza...">
    <div id="keyStatus" style="font-size:12px; margin-top:5px; color:#aaa;"></div>
    <div style="display:flex; gap:10px;">
      <button class="glass-btn" onclick="clearSettings()" style="background:rgba(255,255,255,0.05)">Clear</button>
      <button class="glass-btn" onclick="saveSettings()" style="background:var(--neon-blue); color:#000;">Save & Enable</button>
    </div>
  </div>
</div>

<!-- AI OVERLAY -->
<div id="aiOverlay" class="chart-overlay" onclick="closeModals(event)">
  <div class="chart-modal ai-dialog" onclick="event.stopPropagation()">
    <h2 style="margin-top:0" id="aiTitle">Analysis</h2>
    <div id="aiLoading" style="text-align:center;">
      <div class="loader"></div>
      <p style="opacity:0.6" id="aiLoadingText">Thinking...</p>
    </div>
    <div id="aiContent" class="ai-content" style="display:none;"></div>
    <button class="glass-btn" onclick="closeModals()">Close</button>
  </div>
</div>

<script>
/* --- Init Firebase --- */
// CORRECT DATABASE URL
const firebaseConfig = { 
  databaseURL: "https://ucfd-31619-default-rtdb.asia-southeast1.firebasedatabase.app/" 
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const TH = { vol: 10.5, cur: 2.8, tmp: 60.0, lek: 0.1 };

/* --- UI References --- */
const ui = {
  v: { el: document.getElementById('vVol'), card: document.getElementById('cVol') },
  c: { el: document.getElementById('vCur'), card: document.getElementById('cCur') },
  t: { el: document.getElementById('vTmp'), card: document.getElementById('cTmp') },
  l: { el: document.getElementById('vLek'), card: document.getElementById('cLek') },
  sys: document.getElementById('sys'),
  relay: { btn: document.getElementById('btnRelay'), txt: document.getElementById('txtRelay') }
};

/* --- Charting Setup --- */
let mainChartInstance = null;
const ctx = document.getElementById('chartMain').getContext('2d');
const history = { vol: [], cur: [], tmp: [], lek: [] };
const labels = { vol: [], cur: [], tmp: [], lek: [] };
const MAX_PTS = 50;

function updateHist(key, val) {
  const now = new Date();
  history[key].push(val);
  labels[key].push(now);
  if(history[key].length > MAX_PTS) { history[key].shift(); labels[key].shift(); }
}

function openChart(type) {
  const overlay = document.getElementById('chartOverlay');
  const title = document.getElementById('chartTitle');
  overlay.classList.add('open');
  
  let color = '#fff';
  if(type === 'vol') { title.innerText = 'Voltage History'; color = '#00f2fe'; }
  if(type === 'cur') { title.innerText = 'Current History'; color = '#0aff60'; }
  if(type === 'tmp') { title.innerText = 'Temp History'; color = '#ffaa00'; }
  if(type === 'lek') { title.innerText = 'Leakage History'; color = '#ff0f4f'; }

  if(mainChartInstance) mainChartInstance.destroy();

  const gradient = ctx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');

  mainChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels[type],
      datasets: [{
        data: history[type],
        borderColor: color,
        backgroundColor: gradient,
        fill: true,
        pointRadius: 4,
        pointBackgroundColor: '#fff',
        pointBorderColor: color,
        borderWidth: 2,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 800, easing: 'easeOutQuart' },
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888' } }
      }
    }
  });
}

/* --- API Key Management (SECURE - NO HARDCODING) --- */
window.onload = function() {
  const key = localStorage.getItem('gemini_api_key');
  if(!key) {
    setTimeout(() => {
        openSettings();
        document.getElementById('keyStatus').innerText = "⚠️ AI features paused. Please enter key.";
    }, 800);
  }
};

function getApiKey() {
  const key = localStorage.getItem('gemini_api_key');
  if (!key || key.trim() === "") {
    alert("Please enter your API Key in Settings to use this feature.");
    openSettings();
    return null;
  }
  return key;
}

function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
  const savedKey = localStorage.getItem('gemini_api_key');
  document.getElementById('apiKeyInput').value = savedKey || '';
  if(savedKey) {
      document.getElementById('keyStatus').innerText = "✅ Key saved securely.";
      document.getElementById('keyStatus').style.color = "var(--neon-green)";
  }
}

function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if(key) {
      localStorage.setItem('gemini_api_key', key);
      document.getElementById('keyStatus').innerText = "✅ Saved!";
      setTimeout(() => closeModals(), 500);
  } else {
      alert("Please enter a valid key.");
  }
}

function clearSettings() {
  localStorage.removeItem('gemini_api_key');
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('keyStatus').innerText = "Key removed.";
}

function closeModals(e) {
  if (e && e.target !== e.currentTarget) return; 
  document.querySelectorAll('.chart-overlay').forEach(m => m.classList.remove('open'));
  document.getElementById('cameraInput').value = '';
}

/* --- AI Logic (Gemini 2.5 Flash) --- */
async function callGemini(payload, loadingMsg, title) {
  const apiKey = getApiKey();
  if(!apiKey) return;

  const overlay = document.getElementById('aiOverlay');
  const loader = document.getElementById('aiLoading');
  const content = document.getElementById('aiContent');
  
  document.getElementById('aiTitle').innerText = title;
  document.getElementById('aiLoadingText').innerText = loadingMsg;
  
  overlay.classList.add('open');
  loader.style.display = 'block';
  content.style.display = 'none';
  content.innerHTML = '';

  try {
    // USING LATEST 2.5 MODEL (PREVIEW)
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    if(!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || "API Request Failed");
    }

    const data = await response.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
    content.innerHTML = marked.parse(text);
    loader.style.display = 'none';
    content.style.display = 'block';
  } catch (err) {
    loader.style.display = 'none';
    content.style.display = 'block';
    content.innerHTML = `<p style="color:#ff0f4f"><strong>Error:</strong> ${err.message}</p>`;
  }
}

function diagnoseSystem() {
  const prompt = `Analyze: Voltage=${ui.v.el.innerText}V, Current=${ui.c.el.innerText}A, Temp=${ui.t.el.innerText}C, Leakage=${ui.l.el.innerText}A. Thresholds: V<10.5, I>2.8, T>60, L>0.1. Report status concisely.`;
  callGemini({ contents: [{ parts: [{ text: prompt }] }] }, "Diagnosing...", "Diagnosis");
}

function generateReport() {
  const prompt = `Create a formal electrical maintenance report for current session. Readings: ${ui.v.el.innerText}V, ${ui.c.el.innerText}A. Is system stable?`;
  callGemini({ contents: [{ parts: [{ text: prompt }] }] }, "Compiling Report...", "Report");
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const b64 = evt.target.result.split(',')[1];
    callGemini({
      contents: [{
        parts: [
          { text: "Analyze this wiring/component image for physical damage, corrosion, or burns." },
          { inline_data: { mime_type: file.type, data: b64 } }
        ]
      }]
    }, "Scanning...", "Visual Inspector");
  };
  reader.readAsDataURL(file);
}

/* --- Data & Relay Logic --- */
let manualLockActive = false;
let manualLockTimer = null;

function processData(data) {
  // Normalize keys
  const v = Number(data.voltage ?? data.Voltage ?? data.V ?? 0);
  const c = Number(data.current ?? data.Current ?? data.I ?? 0);
  const t = Number(data.temperature ?? data.Temperature ?? data.temp ?? 0);
  const l = Number(data.leakage_current ?? data.leakage ?? data.Leakage ?? 0);

  ui.v.el.innerText = v.toFixed(1);
  ui.c.el.innerText = c.toFixed(2);
  ui.t.el.innerText = t.toFixed(1);
  ui.l.el.innerText = l.toFixed(3);

  // Fault Visuals
  setCardState(ui.v.card, v < TH.vol);
  setCardState(ui.c.card, c > TH.cur);
  setCardState(ui.t.card, t > TH.tmp);
  setCardState(ui.l.card, l > TH.lek);

  const anyFault = (v < TH.vol) || (c > TH.cur) || (t > TH.tmp) || (l > TH.lek);
  if(anyFault) {
    ui.sys.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Fault Detected';
    ui.sys.style.color = 'var(--neon-red)';
    ui.sys.style.borderColor = 'rgba(255, 15, 79, 0.4)';
    ui.sys.style.backgroundColor = 'rgba(255, 15, 79, 0.1)';
  } else {
    ui.sys.innerHTML = '<i class="fas fa-check-circle"></i> System Secure';
    ui.sys.style.color = 'var(--neon-green)';
    ui.sys.style.borderColor = 'rgba(10, 255, 96, 0.2)';
    ui.sys.style.backgroundColor = 'rgba(10, 255, 96, 0.1)';
  }

  updateHist('vol', v); updateHist('cur', c); updateHist('tmp', t); updateHist('lek', l);
  if(mainChartInstance) mainChartInstance.update('none');

  if(!manualLockActive) {
    const rStat = data.relay_status ?? data.relay ?? 'CLOSED';
    const isOpen = (String(rStat).toUpperCase() === 'OPEN' || rStat == 1);
    setRelayVisuals(isOpen);
  }
}

function setCardState(card, isBad) {
  if(isBad) card.classList.add('fault');
  else card.classList.remove('fault');
}

function setRelayVisuals(isOpen) {
  const btn = ui.relay.btn;
  const txt = ui.relay.txt;
  if(isOpen) {
    btn.classList.add('tripped'); 
    txt.innerText = "TRIPPED";
    txt.style.color = "var(--neon-red)";
  } else {
    btn.classList.remove('tripped'); 
    txt.innerText = "ARMED";
    txt.style.color = "#fff";
  }
}

// Relay Click
ui.relay.btn.addEventListener('click', () => {
  const isTripped = ui.relay.btn.classList.contains('tripped');
  const nextState = !isTripped; 
  
  setRelayVisuals(nextState);
  manualLockActive = true;
  if(manualLockTimer) clearTimeout(manualLockTimer);
  manualLockTimer = setTimeout(() => { manualLockActive = false; }, 6000);

  // Update BOTH locations to ensure ESP32 sees it
  const updates = {};
  updates['manual_controls/relay_status'] = nextState ? 'OPEN' : 'CLOSED';
  updates['relay'] = nextState ? 1 : 0;

  db.ref().update(updates).catch(e => {
    alert("Write Error: " + e.message);
    setRelayVisuals(isTripped);
  });
});

// Listeners
const sensorRef = db.ref('sensor_data');
sensorRef.limitToLast(1).on('child_added', s => { if(s.val()) processData(s.val()); });
db.ref('manual_controls/relay_status').on('value', s => {
  if(!manualLockActive && s.exists()) {
    setRelayVisuals(String(s.val()).toUpperCase() === 'OPEN');
  }
});

</script>
